<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DX-M1 Vision</title>
<style>
  :root {
    --bg: #0b1220; --card: #141d30; --line: #24314d; --text: #e8eefc; --muted: #8ea0c4;
    --accent: #2f7bff; --accent2: #22c3a6; --danger: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; font-weight: 800; letter-spacing: -1px; }
  header h1 { font-size: 20px; margin: 0; }
  header small { color: var(--muted); display: block; font-size: 12px; }
  #status-dot { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; background: #555; }
  #status-dot.ok { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  #status-dot.bad { background: var(--danger); }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode { text-align: left; border: 1px solid var(--line); background: #0f1626; color: var(--text);
    border-radius: 12px; padding: 10px; font: inherit; cursor: pointer; }
  .mode b { display: block; font-size: 15px; }
  .mode span { font-size: 12px; color: var(--muted); }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: #12234a;
    box-shadow: inset 0 0 0 1px var(--accent); }

  .seg { display: flex; background: #0f1626; border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 9px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 700; cursor: pointer;
    background: #22304f; color: var(--text); text-decoration: none; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.go { background: var(--accent2); color: #04241e; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 20px; height: 20px; }

  .conf { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .conf input { flex: 1; accent-color: var(--accent); }
  .conf output { width: 3.2em; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

  .media { width: 100%; border-radius: 12px; background: #000; display: block; max-height: 70vh; object-fit: contain; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .note.warn { color: #ffc35c; }
  .err { color: var(--danger); font-weight: 600; }

  .bar { height: 10px; background: #0f1626; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .25s; }
  .bar.indeterminate i { width: 35%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  #stage { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: #0f1626; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: 13px; }
  .chip b { color: var(--accent2); }
  .stats { font-size: 12px; color: var(--muted); margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">DX</div>
    <div><h1>DX-M1 Vision</h1><small id="host">on-device NPU inference</small></div>
    <div id="status-dot" title="Checking connection"></div>
  </header>

  <!-- 1. setup -->
  <div id="setup">
    <section>
      <h2>Mode</h2>
      <div class="modes" id="modes"><span class="note">Loading modes…</span></div>
      <div class="conf">
        <label for="conf">Confidence</label>
        <input id="conf" type="range" min="0.1" max="0.9" step="0.05" value="0.35">
        <output id="conf-out">35%</output>
      </div>
    </section>

    <section>
      <h2>Capture</h2>
      <div class="seg" role="group">
        <button id="kind-image" aria-pressed="true">Photo</button>
        <button id="kind-video" aria-pressed="false">Video ≤ 10 s</button>
      </div>
      <div class="row">
        <label class="btn primary" id="cap-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="cap-text">Take photo</span>
          <input id="cap-input" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
          Library
          <input id="lib-input" type="file" accept="image/*" hidden>
        </label>
      </div>
    </section>

    <section id="preview-card" hidden>
      <h2>Ready to send</h2>
      <div id="preview"></div>
      <p class="note" id="preview-note"></p>
      <div class="row"><button class="btn go" id="send">Send to DX-M1</button></div>
    </section>
  </div>

  <!-- 2. working -->
  <section id="working" hidden>
    <h2 id="work-title">Working</h2>
    <div class="bar" id="bar"><i></i></div>
    <div id="stage">Uploading…</div>
  </section>

  <!-- 3. result -->
  <section id="result" hidden>
    <h2 id="result-title">Result</h2>
    <div id="result-media"></div>
    <div class="chips" id="chips"></div>
    <div class="stats" id="stats"></div>
    <div class="row">
      <a class="btn" id="save" download>Save</a>
      <button class="btn" id="share" hidden>Share</button>
    </div>
    <div class="row"><button class="btn primary" id="again">New capture</button></div>
  </section>

  <section id="error" hidden>
    <h2>Something went wrong</h2>
    <p class="err" id="error-text"></p>
    <div class="row"><button class="btn primary" id="err-back">Back</button></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { mode: null, modes: [], kind: "image", file: null, maxSeconds: 10, resultBlob: null };

function show(which) {
  for (const id of ["setup", "working", "result", "error"]) $(id).hidden = id !== which;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function loadModes() {
  try {
    const r = await fetch("/api/modes");
    const j = await r.json();
    state.modes = j.modes; state.maxSeconds = j.maxSeconds || 10;
    $("status-dot").className = "ok"; $("status-dot").title = "DX-M1 server reachable";
    $("host").textContent = `${location.host} · DEEPX DX-M1`;
    const box = $("modes"); box.innerHTML = "";
    const saved = localStorage.getItem("dx-mode");
    state.mode = (j.modes.find(m => m.id === saved) || j.modes[0] || {}).id;
    for (const m of j.modes) {
      const b = document.createElement("button");
      b.className = "mode"; b.dataset.id = m.id;
      b.innerHTML = `<b></b><span></span>`;
      b.querySelector("b").textContent = m.label;
      b.querySelector("span").textContent = m.description;
      b.onclick = () => { state.mode = m.id; localStorage.setItem("dx-mode", m.id); paintModes(); };
      box.appendChild(b);
    }
    if (j.video === false) {
      $("kind-video").disabled = true;
      $("kind-video").textContent = "Video (server has no ffmpeg)";
    }
    if (!j.modes.length) box.innerHTML = `<span class="err">No models found on the server.</span>`;
    paintModes();
  } catch (e) {
    $("status-dot").className = "bad";
    $("modes").innerHTML = `<span class="err">Can't reach the DX-M1 server.</span>`;
  }
}
function paintModes() {
  for (const b of $("modes").children) b.setAttribute("aria-pressed", String(b.dataset.id === state.mode));
}

const conf = $("conf");
conf.value = localStorage.getItem("dx-conf") || "0.35";
const paintConf = () => { $("conf-out").textContent = Math.round(conf.value * 100) + "%"; };
conf.oninput = () => { paintConf(); localStorage.setItem("dx-conf", conf.value); };
paintConf();

function setKind(kind) {
  state.kind = kind;
  $("kind-image").setAttribute("aria-pressed", String(kind === "image"));
  $("kind-video").setAttribute("aria-pressed", String(kind === "video"));
  const accept = kind === "image" ? "image/*" : "video/*";
  $("cap-input").accept = accept; $("lib-input").accept = accept;
  $("cap-text").textContent = kind === "image" ? "Take photo" : "Record video";
  clearFile();
}
$("kind-image").onclick = () => setKind("image");
$("kind-video").onclick = () => setKind("video");

function clearFile() {
  state.file = null;
  $("preview-card").hidden = true;
  const old = $("preview").querySelector("img,video");
  if (old && old.src.startsWith("blob:")) URL.revokeObjectURL(old.src);
  $("preview").innerHTML = "";
}

function onPick(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  clearFile();
  const isVideo = f.type.startsWith("video/") || /\.(mov|mp4|m4v|webm|3gp|mkv)$/i.test(f.name);
  if (isVideo !== (state.kind === "video")) setKind(isVideo ? "video" : "image");
  state.file = f;
  const url = URL.createObjectURL(f);
  const note = $("preview-note");
  note.className = "note";
  note.textContent = `${(f.size / 1048576).toFixed(1)} MB`;
  if (isVideo) {
    const v = document.createElement("video");
    Object.assign(v, { src: url, controls: true, playsInline: true, muted: true, preload: "metadata" });
    v.className = "media";
    v.onloadedmetadata = () => {
      const d = v.duration;
      if (isFinite(d)) {
        note.textContent = `${d.toFixed(1)} s · ${(f.size / 1048576).toFixed(1)} MB`;
        if (d > state.maxSeconds + 0.3) {
          note.className = "note warn";
          note.textContent += ` — only the first ${state.maxSeconds} s will be processed.`;
        }
      }
    };
    $("preview").appendChild(v);
  } else {
    const img = document.createElement("img");
    img.className = "media"; img.src = url; img.alt = "Selected photo";
    $("preview").appendChild(img);
  }
  $("preview-card").hidden = false;
  $("preview-card").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("cap-input").onchange = onPick;
$("lib-input").onchange = onPick;

function setBar(frac, text) {
  const bar = $("bar");
  if (frac == null) { bar.classList.add("indeterminate"); bar.firstElementChild.style.width = ""; }
  else { bar.classList.remove("indeterminate"); bar.firstElementChild.style.width = (frac * 100).toFixed(1) + "%"; }
  if (text) $("stage").textContent = text;
}

function upload(url, file) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    x.upload.onprogress = (e) => {
      if (e.lengthComputable) setBar(e.loaded / e.total * 0.3, `Uploading… ${Math.round(e.loaded / e.total * 100)}%`);
    };
    x.onload = () => {
      let j = {}; try { j = JSON.parse(x.responseText); } catch {}
      x.status < 300 ? resolve(j) : reject(new Error(j.error || `Upload failed (${x.status})`));
    };
    x.onerror = () => reject(new Error("Network error while uploading."));
    x.send(file);
  });
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function send() {
  if (!state.file || !state.mode) return;
  const modeInfo = state.modes.find(m => m.id === state.mode);
  $("work-title").textContent = `${modeInfo ? modeInfo.label : state.mode} · ${state.kind}`;
  show("working"); setBar(0, "Uploading…");
  try {
    const q = new URLSearchParams({ kind: state.kind, mode: state.mode, conf: conf.value });
    let job = await upload(`/api/jobs?${q}`, state.file);
    const id = job.id;
    while (job.state === "queued" || job.state === "running") {
      if (job.state === "queued") setBar(0.3, job.position ? `Waiting in line (${job.position} ahead)…` : "Starting…");
      else if (state.kind === "video") setBar(0.3 + job.progress * 0.7, `Running on DX-M1… ${Math.round(job.progress * 100)}%`);
      else setBar(null, "Running on DX-M1…");
      await sleep(state.kind === "video" ? 600 : 250);
      const r = await fetch(`/api/jobs/${id}`);
      job = await r.json();
      if (!r.ok) throw new Error(job.error || "Lost track of the job.");
    }
    if (job.state === "error") throw new Error(job.error);
    setBar(1, "Downloading result…");
    const res = await fetch(`/api/jobs/${id}/result`);
    if (!res.ok) throw new Error("Couldn't download the result.");
    const blob = await res.blob();
    showResult(job, blob, modeInfo);
  } catch (e) {
    $("error-text").textContent = e.message || String(e);
    show("error");
  }
}
$("send").onclick = send;

function showResult(job, blob, modeInfo) {
  if (state.resultUrl) URL.revokeObjectURL(state.resultUrl);
  const url = state.resultUrl = URL.createObjectURL(blob);
  const isVideo = blob.type.startsWith("video/");
  const ext = isVideo ? "mp4" : "jpg";
  const name = `dx-m1-${job.mode}-${Date.now()}.${ext}`;
  const box = $("result-media"); box.innerHTML = "";
  let el;
  if (isVideo) {
    el = document.createElement("video");
    Object.assign(el, { src: url, controls: true, playsInline: true, autoplay: true, muted: true, loop: true });
  } else {
    el = document.createElement("img"); el.src = url; el.alt = "Annotated result";
  }
  el.className = "media"; box.appendChild(el);
  $("result-title").textContent = `${modeInfo ? modeInfo.label : job.mode} result`;

  const s = job.summary || {};
  const chips = $("chips"); chips.innerHTML = "";
  const entries = Object.entries(s.counts || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) chips.innerHTML = `<span class="chip">Nothing found above ${Math.round(conf.value * 100)}%</span>`;
  for (const [k, v] of entries) {
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = `<b></b> `; c.firstChild.textContent = v; c.append(k);
    chips.appendChild(c);
  }
  const bits = [];
  if (isVideo) {
    bits.push(`${s.frames} frames · ${s.seconds} s @ ${s.fps} fps`, `NPU ${s.npuMsPerFrame} ms/frame`);
    if (entries.length) bits.push("counts = most seen in one frame");
    if (s.trimmed) bits.push(`trimmed to ${state.maxSeconds} s`);
  } else {
    bits.push(`${s.width}×${s.height}`, `NPU ${s.npuMs} ms`);
  }
  bits.push(`total ${s.totalSec} s`);
  $("stats").textContent = bits.join(" · ");

  const save = $("save"); save.href = url; save.download = name;
  const file = new File([blob], name, { type: blob.type });
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  $("share").hidden = !canShare;
  $("share").onclick = () => navigator.share({ files: [file], title: "DX-M1 result" }).catch(() => {});
  show("result");
}

$("again").onclick = () => { clearFile(); show("setup"); };
$("err-back").onclick = () => show("setup");

loadModes();
</script>
</body>
</html>
